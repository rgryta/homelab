services:
  messenger-mcp:
    labels:
      - traefik.enable=false
      - wud.watch=true
      - wud.watch.digest=true
      - autoheal=true
    image: 172.20.0.52:5000/messenger-sync:latest
    container_name: messenger-mcp
    restart: unless-stopped
    environment:
      MESSENGER_DSN: postgresql://messenger_mcp:${MESSENGER_MCP_DB_PASSWORD}@homelab-postgres:5432/messenger
      MESSENGER_HOST: 0.0.0.0
      MESSENGER_PORT: "8000"
      TZ: Europe/Warsaw
    command:
      - messenger-sync
      - mcp
    networks:
      homelab-network:
        ipv4_address: 172.20.0.88
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  messenger-harvest:
    labels:
      - traefik.enable=false
      - wud.watch=true
      - wud.watch.digest=true
    image: 172.20.0.52:5000/messenger-sync:latest
    container_name: messenger-harvest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MESSENGER_DSN: postgresql://messenger_ingest:${MESSENGER_INGEST_DB_PASSWORD}@homelab-postgres:5432/messenger
      TZ: Europe/Warsaw
    command:
      - messenger-sync
      - harvest
    volumes:
      - /mnt/quick/apps/volumes/messenger-sync/profile:/profile
    networks:
      homelab-network:
        ipv4_address: 172.20.0.89
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
    shm_size: 1gb

networks:
  homelab-network:
    external: true
