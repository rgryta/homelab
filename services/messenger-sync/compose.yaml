services:
  messenger-mcp:
    labels:
      - traefik.enable=false
      - wud.watch=true
      - wud.tag.include=^\d+\.\d+\.\d+$
      - wud.trigger.include=dockercompose.messenger
      - autoheal=true
    image: ghcr.io/rgryta/messenger-sync:0.2.6
    container_name: messenger-mcp
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      MESSENGER_DSN: postgresql://messenger_mcp:${MESSENGER_MCP_DB_PASSWORD}@homelab-postgres:5432/messenger
      MESSENGER_HOST: 0.0.0.0
      MESSENGER_PORT: "8000"
      MESSENGER_MCP_ALLOWED_HOSTS: messenger-mcp
      TZ: Europe/Warsaw
    command:
      - /usr/local/bin/messenger-mcp
    networks:
      homelab-network:
        ipv4_address: 172.20.0.88
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/messenger-mcp
        - --health-check
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  messenger-ingest:
    labels:
      - traefik.enable=false
      - wud.watch=true
      - wud.tag.include=^\d+\.\d+\.\d+$
      - wud.trigger.include=dockercompose.messenger
    image: ghcr.io/rgryta/messenger-sync:0.2.6
    container_name: messenger-ingest
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      MESSENGER_DSN: postgresql://messenger_ingest:${MESSENGER_INGEST_DB_PASSWORD}@homelab-postgres:5432/messenger
      MESSENGER_ACCOUNT: ${MESSENGER_ACCOUNT}
      TZ: Europe/Warsaw
    command:
      - /usr/local/bin/messenger-ingest
    networks:
      homelab-network:
        ipv4_address: 172.20.0.89
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M

networks:
  homelab-network:
    external: true
