services:
  parking:
    image: 172.20.0.52:5000/parking:latest
    container_name: parking
    restart: unless-stopped
    env_file: .env
    volumes:
      - parking_data:/app/data
    networks:
      - homelab-network
    labels:
      - traefik.enable=true
      - wud.watch=true
      - wud.watch.digest=true
      - traefik.http.routers.parking.rule=Host(`parking.gryta.eu`)
      - traefik.http.routers.parking.entrypoints=websecure
      - traefik.http.routers.parking.tls.certresolver=le
volumes:
  parking_data:
    driver_opts:
      type: none
      o: bind
      device: /mnt/quick/apps/volumes/act-parking/data
networks:
  homelab-network:
    name: homelab-network
    external: true
