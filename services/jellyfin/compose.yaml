services:
  jellyfin:
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellyfin.rule=Host(`jellyfin.gryta.eu`) &&
        !Path(`/Users/authenticatebyname`)
      - traefik.http.routers.jellyfin.entrypoints=websecure
      - traefik.http.routers.jellyfin.tls.certresolver=le
      - traefik.http.services.jellyfin.loadbalancer.server.port=8096
      - wud.watch=true
      - wud.tag.include=^\d+\.\d+\.\d+$
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin
    volumes:
      - jf_config:/config
      - jf_cache:/cache
      - jf_media:/media
    restart: unless-stopped
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    networks:
      homelab-network:
        ipv4_address: 172.20.0.103
    extra_hosts:
      - seerr.gryta.eu:172.20.0.106
    environment:
      - JELLYFIN_PublishedServerUrl=https://jellyfin.gryta.eu
  seerr:
    labels:
      - traefik.enable=true
      - traefik.http.routers.seerr.rule=Host(`seerr.gryta.eu`)
      - traefik.http.routers.seerr.entrypoints=websecure
      - traefik.http.routers.seerr.tls.certresolver=le
      - traefik.http.routers.seerr.middlewares=authentik-forward-auth@file
      - traefik.http.routers.seerr.service=seerr
      - traefik.http.services.seerr.loadbalancer.server.port=5055
      # Old hostname: redirect before forward-auth so bookmarks keep working
      - traefik.http.routers.jellyseerr-legacy.rule=Host(`jellyseerr.gryta.eu`)
      - traefik.http.routers.jellyseerr-legacy.entrypoints=websecure
      - traefik.http.routers.jellyseerr-legacy.tls.certresolver=le
      - traefik.http.routers.jellyseerr-legacy.middlewares=seerr-redirect
      - traefik.http.routers.jellyseerr-legacy.service=seerr
      - traefik.http.middlewares.seerr-redirect.redirectregex.regex=^https://jellyseerr\.gryta\.eu/(.*)
      - traefik.http.middlewares.seerr-redirect.redirectregex.replacement=https://seerr.gryta.eu/$${1}
      - traefik.http.middlewares.seerr-redirect.redirectregex.permanent=true
      - wud.watch=true
      - wud.tag.include=^v\d+\.\d+\.\d+$
    image: ghcr.io/seerr-team/seerr:v3.5.1
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Warsaw
    networks:
      homelab-network:
        ipv4_address: 172.20.0.106
      homelab-vpn-network:
        ipv4_address: 172.20.2.14
    extra_hosts:
      - jellyfin.gryta.eu:172.20.0.103
      - sonarr.gryta.eu:172.20.2.4
      - radarr.gryta.eu:172.20.2.5
    volumes:
      - seerr_config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public
        || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
volumes:
  jf_media:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /mnt/archive/media
  jf_config:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /mnt/quick/apps/volumes/jellyfin/config
  jf_cache:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /mnt/quick/apps/volumes/jellyfin/cache
  seerr_config:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /mnt/quick/apps/volumes/seerr/config
networks:
  homelab-network:
    external: true
  homelab-vpn-network:
    external: true
