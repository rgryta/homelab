services:
  llama-cpp:
    labels:
      - traefik.enable=true
      - traefik.http.routers.llama.rule=Host(`llama.gryta.eu`)
      - traefik.http.routers.llama.entrypoints=websecure
      - traefik.http.routers.llama.tls.certresolver=le
      - traefik.http.services.llama.loadbalancer.server.port=8000
      - wud.watch=true
      - wud.watch.digest=true
    image: ghcr.io/ggml-org/llama.cpp:server-intel
    container_name: llama-cpp
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - models:/models
    environment:
      LLAMA_ARG_MODEL: /models/nomic-embed-text-v1.5.Q8_0.gguf
      LLAMA_ARG_MODEL_URL: https://huggingface.co/nomic-ai/nomic-embed-text-v1.5-GGUF/resolve/main/nomic-embed-text-v1.5.Q8_0.gguf
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_CTX_SIZE: 2048
      LLAMA_ARG_N_PARALLEL: 4
      LLAMA_ARG_ENDPOINT_METRICS: 1
      LLAMA_ARG_PORT: 8000
      LLAMA_ARG_EMBEDDINGS: 1
      LLAMA_ARG_POOLING: mean
      LLAMA_API_KEY: ${LLAMA_API_KEY}
      LLAMA_LOG_VERBOSITY: 2
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8000/health
      interval: 1m
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      homelab-network:
        ipv4_address: 172.20.0.15
    restart: unless-stopped
  whisper-cpp:
    image: ghcr.io/ggml-org/whisper.cpp:main-intel
    container_name: whisper-cpp
    command:
      - /app/build/bin/whisper-server --host 0.0.0.0 --port 8080 -m /models/ggml-small-q5_1.bin -l auto --convert --tmp-dir /tmp -sns
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - models:/models:ro
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/
      interval: 1m
      timeout: 5s
      retries: 5
      start_period: 60s
    labels:
      - wud.watch=true
      - wud.watch.digest=true
    networks:
      homelab-network:
        ipv4_address: 172.20.0.9
    restart: unless-stopped
volumes:
  models:
    external: true
    name: llama-cpp_models
networks:
  homelab-network:
    external: true
