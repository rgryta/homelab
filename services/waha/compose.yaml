services:
  waha:
    labels:
      - traefik.enable=true
      - traefik.http.routers.waha.rule=Host(`waha.gryta.eu`)
      - traefik.http.routers.waha.entrypoints=websecure
      - traefik.http.routers.waha.tls.certresolver=le
      - traefik.http.routers.waha.middlewares=authentik-forward-auth@file
      - traefik.http.services.waha.loadbalancer.server.port=3000
      - wud.watch=true
      - wud.tag.include=^noweb-\d+\.\d+\.\d+$
    image: devlikeapro/waha:noweb-2026.10.1
    container_name: waha
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WAHA_APPS_ENABLED: "True"
      WAHA_API_KEY: sha512:${WAHA_API_KEY_SHA512}
      WAHA_API_KEY_PLAIN: ${WAHA_API_KEY_PLAIN}
      REDIS_URL: redis://homelab-valkey:6379/3
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WHATSAPP_SWAGGER_USERNAME: ${WAHA_DASHBOARD_USERNAME}
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_NAMESPACE: all
      WAHA_BASE_URL: https://waha.gryta.eu
      WAHA_MEDIA_STORAGE: LOCAL
      WHATSAPP_FILES_FOLDER: /app/.media
      WHATSAPP_FILES_LIFETIME: 0
      WAHA_LOG_FORMAT: JSON
      WAHA_LOG_LEVEL: info
      TZ: Europe/Warsaw
    volumes:
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media
    networks:
      homelab-network:
        ipv4_address: 172.20.0.80
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/ping', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  whatsapp-ingest:
    labels:
      - traefik.enable=false
      - wud.watch=true
      - wud.watch.digest=true
    image: 172.20.0.52:5000/whatsapp-sync:latest
    container_name: whatsapp-ingest
    restart: unless-stopped
    depends_on:
      - waha
    env_file:
      - .env
    environment:
      WHATSAPP_WAHA_URL: http://waha:3000
      WHATSAPP_WAHA_API_KEY: ${WAHA_API_KEY_PLAIN}
      WHATSAPP_DSN: postgresql://whatsapp_ingest:${WHATSAPP_INGEST_PASSWORD}@homelab-postgres:5432/whatsapp
      WHATSAPP_INTERVAL: "120"
      WHATSAPP_WHISPER_MODEL: small
      TZ: Europe/Warsaw
    volumes:
      - whisper_models:/app/.cache/huggingface
    networks:
      homelab-network:
        ipv4_address: 172.20.0.85
    command: ["whatsapp-ingest"]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  whatsapp-mcp:
    labels:
      - traefik.enable=false
      - wud.watch=true
      - wud.watch.digest=true
      - autoheal=true
    image: 172.20.0.52:5000/whatsapp-sync:latest
    container_name: whatsapp-mcp
    restart: unless-stopped
    depends_on:
      - waha
    env_file:
      - .env
    environment:
      WHATSAPP_WAHA_URL: http://waha:3000
      WHATSAPP_WAHA_API_KEY: ${WAHA_API_KEY_PLAIN}
      WHATSAPP_DSN: postgresql://whatsapp_mcp:${WHATSAPP_MCP_PASSWORD}@homelab-postgres:5432/whatsapp
      WHATSAPP_HOST: 0.0.0.0
      WHATSAPP_PORT: "8000"
      TZ: Europe/Warsaw
    networks:
      homelab-network:
        ipv4_address: 172.20.0.84
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  waha_sessions:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /mnt/quick/apps/volumes/waha/sessions
  waha_media:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /mnt/quick/apps/volumes/waha/media
  whisper_models:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /mnt/quick/apps/volumes/waha/whisper
networks:
  homelab-network:
    external: true
