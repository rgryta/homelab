services:
  vpn-client:
    labels:
      - traefik.enable=false
      - wud.watch=true
      - wud.tag.include=^v\d+\.\d+\.\d+$
    image: qmcgaw/gluetun:v3.41.3
    container_name: vpn-client
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=airvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${AIRVPN_PRIVATE_KEY}
      - WIREGUARD_PRESHARED_KEY=${AIRVPN_PRESHARED_KEY}
      - WIREGUARD_ADDRESSES=${AIRVPN_ADDRESSES}
      - WIREGUARD_MTU=${AIRVPN_MTU}
      - SERVER_COUNTRIES=Germany
      # qBittorrent WebUI (shares this netns) must be reachable from traefik
      - FIREWALL_INPUT_PORTS=8888
      # inbound BitTorrent peers arrive through the tunnel on the reserved port
      - FIREWALL_VPN_INPUT_PORTS=${AIRVPN_FORWARDED_PORT}
      - FIREWALL_OUTBOUND_SUBNETS=192.168.0.0/16,172.16.0.0/12
      # keep pihole as resolver instead of gluetun's built-in DoT
      - DOT=off
      - DNS_ADDRESS=172.20.2.13
      - TZ=Europe/Warsaw
      - UPDATER_PERIOD=24h
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    networks:
      homelab-vpn-network:
        ipv4_address: 172.20.2.3
    restart: unless-stopped
networks:
  homelab-network:
    external: true
  homelab-vpn-network:
    external: true
