services:
  whatsupdocker:
    labels:
      - traefik.enable=true
      - traefik.http.routers.wud.rule=Host(`wud.gryta.eu`)
      - traefik.http.routers.wud.entrypoints=websecure
      - traefik.http.routers.wud.tls.certresolver=le
      - traefik.http.services.wud.loadbalancer.server.port=3000
      - traefik.http.routers.wud.middlewares=authentik-forward-auth@file
      - wud.watch=true
      - wud.tag.include=^\d+\.\d+$
      - autoheal=true
    image: ghcr.io/getwud/wud:8.4
    container_name: wud
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/quick/apps/volumes/wud/service-worker.js:/home/node/app/ui/service-worker.js:ro
      - /mnt/.ix-apps/app_mounts/dockge/stacks/complexio:/mnt/.ix-apps/app_mounts/dockge/stacks/complexio
    environment:
      - WUD_WATCHER_LOCAL_CRON=0 5 * * *
      - TZ=Europe/Warsaw
      - WUD_TRIGGER_DOCKERCOMPOSE_COMPLEXIO_INCLUDEBYDEFAULT=false
      - WUD_TRIGGER_DOCKERCOMPOSE_COMPLEXIO_BACKUP=true
      - WUD_TRIGGER_DOCKERCOMPOSE_COMPLEXIO_PRUNE=true
      - WUD_REGISTRY_HUB_PUBLIC_LOGIN=${DOCKERHUB_LOGIN}
      - WUD_REGISTRY_HUB_PUBLIC_PASSWORD=${DOCKERHUB_TOKEN}
      - WUD_REGISTRY_LSCR_PUBLIC_USERNAME=${GITHUB_LOGIN}
      - WUD_REGISTRY_LSCR_PUBLIC_TOKEN=${GITHUB_TOKEN}
      - WUD_REGISTRY_GHCR_PUBLIC_USERNAME=${GITHUB_LOGIN}
      - WUD_REGISTRY_GHCR_PUBLIC_TOKEN=${GITHUB_TOKEN}
    networks:
      homelab-network:
        ipv4_address: 172.20.0.21
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536M
networks:
  homelab-network:
    external: true
