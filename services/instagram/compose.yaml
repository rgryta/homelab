services:
  instagram-mcp:
    labels:
      - traefik.enable=false
      - wud.watch=true
      - wud.watch.digest=true
      - autoheal=true
    image: 172.20.0.52:5000/instagram-sync:latest
    container_name: instagram-mcp
    restart: unless-stopped
    environment:
      INSTAGRAM_MCP_DSN: postgresql://instagram_mcp:${INSTAGRAM_MCP_DB_PASSWORD}@homelab-postgres:5432/instagram
      INSTAGRAM_MCP_HOST: 0.0.0.0
      INSTAGRAM_MCP_PORT: "8000"
      TZ: Europe/Warsaw
    command:
      - instagram-sync
      - mcp
    networks:
      homelab-network:
        ipv4_address: 172.20.0.86
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request;
          urllib.request.urlopen('http://localhost:8000/healthz')
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
  instagram-ingest:
    labels:
      - traefik.enable=false
      - wud.watch=true
      - wud.watch.digest=true
    image: 172.20.0.52:5000/instagram-sync:latest
    container_name: instagram-ingest
    restart: "on-failure:5"
    env_file:
      - .env
    environment:
      INSTAGRAM_DSN: postgresql://instagram_ingest:${INSTAGRAM_INGEST_DB_PASSWORD}@homelab-postgres:5432/instagram
      TZ: Europe/Warsaw
    command:
      - instagram-sync
      - ingest
    networks:
      homelab-network:
        ipv4_address: 172.20.0.87
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
networks:
  homelab-network:
    external: true
