services:
  firefox:
    labels:
      - traefik.enable=true
      - traefik.http.routers.firefox.rule=Host(`firefox.gryta.eu`)
      - traefik.http.routers.firefox.entrypoints=websecure
      - traefik.http.routers.firefox.tls.certresolver=le
      # Non-negotiable. A browser reachable without auth is an open proxy into
      # homelab-network for anyone who finds the hostname, and it holds logged-in
      # sessions for whatever has been signed into it.
      - traefik.http.routers.firefox.middlewares=authentik-forward-auth@file
      - traefik.http.services.firefox.loadbalancer.server.port=5800
      - wud.watch=true
      - wud.tag.include=^v\d+\.\d+\.\d+$
    # noVNC, not the linuxserver image. linuxserver's GUI images moved to selkies,
    # which streams over WebRTC and hard-requires the WebCodecs API — that rules out
    # release Firefox for Android, which is the browser this actually gets used from.
    # noVNC is a canvas over a websocket and works anywhere.
    image: jlesage/firefox:v26.08.1
    container_name: firefox
    environment:
      - USER_ID=1000
      - GROUP_ID=1000
      - TZ=Europe/Warsaw
      - APP_NAME=Firefox
      # Authentik is the front door; a second password on the noVNC canvas would only
      # be another thing to lose. Access control lives in the Traefik middleware.
      - VNC_PASSWORD=
      # Sized for a phone in landscape. The canvas scales, so this only sets the
      # backing resolution the pages are laid out at.
      - DISPLAY_WIDTH=1280
      - DISPLAY_HEIGHT=768
      # Firefox restarts instead of taking the container down with it, so a crashed
      # tab does not cost the session.
      - KEEP_APP_RUNNING=1
    volumes:
      # The whole point of this container is that the profile outlives it: cookies,
      # logins and 2FA trust survive a restart, so signing in is a once-per-service
      # job rather than a once-per-deploy one.
      - firefox_config:/config
    # Firefox allocates its renderer shared memory here; the 64M Docker default makes
    # tabs crash on real pages rather than fail in any way that names the cause.
    shm_size: 2gb
    security_opt:
      # The browser's own sandbox uses syscalls Docker's default seccomp profile
      # blocks. Without this Firefox starts and then dies opening a content process.
      - seccomp:unconfined
    restart: unless-stopped
    networks:
      homelab-network:
        ipv4_address: 172.20.0.107
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
volumes:
  firefox_config:
    driver_opts:
      o: bind
      type: none
      device: /mnt/quick/apps/volumes/firefox/config
networks:
  homelab-network:
    external: true
