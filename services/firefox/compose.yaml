services:
  firefox:
    labels:
      - traefik.enable=true
      - traefik.http.routers.firefox.rule=Host(`firefox.gryta.eu`)
      - traefik.http.routers.firefox.entrypoints=websecure
      - traefik.http.routers.firefox.tls.certresolver=le
      - traefik.http.routers.firefox.middlewares=authentik-forward-auth@file
      - traefik.http.services.firefox.loadbalancer.server.port=5800
      - wud.watch=true
      - wud.tag.include=^v\d+\.\d+\.\d+$
    image: jlesage/firefox:v26.09.1
    container_name: firefox
    environment:
      - USER_ID=1000
      - GROUP_ID=1000
      - TZ=Europe/Warsaw
      - APP_NAME=Firefox
      - VNC_PASSWORD=
      - DISPLAY_WIDTH=1280
      - DISPLAY_HEIGHT=768
      - KEEP_APP_RUNNING=1
    volumes:
      - firefox_config:/config
    shm_size: 2gb
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped
    networks:
      homelab-network:
        ipv4_address: 172.20.0.107
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
volumes:
  firefox_config:
    driver_opts:
      o: bind
      type: none
      device: /mnt/quick/apps/volumes/firefox/config
networks:
  homelab-network:
    external: true
