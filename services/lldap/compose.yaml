services:
  lldap:
    labels:
      - traefik.enable=true
      - traefik.http.routers.lldap.rule=Host(`lldap.gryta.eu`)
      - traefik.http.routers.lldap.entrypoints=websecure
      - traefik.http.routers.lldap.tls.certresolver=le
      - traefik.http.routers.lldap.middlewares=authentik-forward-auth@file
      - traefik.http.services.lldap.loadbalancer.server.port=17170
      - wud.watch=true
      - wud.tag.include=^v\d+\.\d+\.\d+-alpine$
    image: lldap/lldap:v0.6.3-alpine
    container_name: lldap
    restart: unless-stopped
    networks:
      homelab-network:
        ipv4_address: 172.20.0.10
    volumes:
      - lldap_data:/data
    environment:
      LLDAP_LDAP_BASE_DN: dc=gryta,dc=eu
      LLDAP_JWT_SECRET: ${LLDAP_JWT_SECRET}
      LLDAP_KEY_SEED: ${LLDAP_KEY_SEED}
      LLDAP_LDAP_USER_PASS: ${LLDAP_ADMIN_PASSWORD}
volumes:
  lldap_data:
    driver_opts:
      o: bind
      type: none
      device: /mnt/quick/apps/volumes/lldap/data
networks:
  homelab-network:
    external: true
