services:
  wireguard:
    labels:
      - traefik.enable=true
      - traefik.docker.network=homelab-network
      - traefik.http.routers.wireguard.rule=Host(`wireguard.gryta.eu`)
      - traefik.http.routers.wireguard.entrypoints=websecure
      - traefik.http.routers.wireguard.tls.certresolver=le
      - traefik.http.services.wireguard.loadbalancer.server.port=51821
      - wud.watch=true
      - wud.tag.include=^15\.\d+\.\d+-beta\.\d+$
    image: ghcr.io/wg-easy/wg-easy:15.4.0-beta.2
    container_name: wireguard
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PORT=51821
      - DISABLE_IPV6=true
      - TZ=Europe/Warsaw
      # --- OIDC via authentik (access gated by lldap_admin binding) ---
      - OAUTH_PROVIDERS=oidc
      - OAUTH_OIDC_NAME=Authentik
      - OAUTH_OIDC_SERVER=https://authentik.gryta.eu/application/o/wireguard/
      - OAUTH_OIDC_CLIENT_ID=j7WW7PwIF4Lq6Ks5umyoUeF9q1rx4GfmLnfsJ1Cz
      - OAUTH_AUTO_REGISTER=true
      - OAUTH_AUTO_LAUNCH=oidc
      - DISABLE_PASSWORD_AUTH=true
    env_file:
      - .env
    volumes:
      - wireguard_config:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - 55555:51820/udp
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=1
    networks:
      homelab-network:
        ipv4_address: 172.20.0.200
        priority: 100
      wireguard-network:
        ipv4_address: 172.20.3.254
        priority: 10
volumes:
  wireguard_config:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /mnt/quick/apps/volumes/wireguard/config
networks:
  homelab-network:
    external: true
  wireguard-network:
    external: true
