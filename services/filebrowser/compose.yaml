services:
  filebrowser:
    labels:
      - traefik.enable=true
      # Single router: Quantum handles OIDC itself, so no forward-auth middleware.
      - traefik.http.routers.filebrowser.rule=Host(`filebrowser.gryta.eu`)
      - traefik.http.routers.filebrowser.entrypoints=websecure
      - traefik.http.routers.filebrowser.tls.certresolver=le
      - traefik.http.routers.filebrowser.service=filebrowser
      - traefik.http.services.filebrowser.loadbalancer.server.port=80
      - traefik.http.services.filebrowser.loadbalancer.passhostheader=true
      - wud.watch=true
      - wud.watch.digest=true
      - wud.tag.include=^2\.\d+\.\d+-beta$
    image: gtstef/filebrowser:2.0.0-beta
    container_name: filebrowser
    restart: unless-stopped
    networks:
      homelab-network:
        ipv4_address: 172.20.0.102
    volumes:
      - filebrowser_quantum:/home/filebrowser/data
      - filebrowser_data:/srv/Data
      - filebrowser_slow:/srv/Slow
    env_file:
      - .env
    user: 1000:1000
volumes:
  filebrowser_quantum:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/quick/apps/volumes/filebrowser-quantum/data
  filebrowser_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/quick/apps/volumes/filebrowser/data
  filebrowser_slow:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/archive/files
networks:
  homelab-network:
    external: true
