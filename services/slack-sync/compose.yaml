services:
  slack-mcp:
    labels:
      - traefik.enable=false
      - wud.watch=true
      - wud.tag.include=^\d+\.\d+\.\d+$
      - wud.trigger.include=dockercompose.slack
      - autoheal=true
    image: ghcr.io/rgryta/slack-sync:0.2.0
    container_name: slack-mcp
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SLACK_MCP_DSN: postgresql://slack_mcp:${SLACK_MCP_DB_PASSWORD}@homelab-postgres:5432/slack
      SLACK_MCP_HOST: 0.0.0.0
      SLACK_MCP_PORT: "8000"
      SLACK_MCP_ALLOWED_HOSTS: slack-mcp
      TZ: Europe/Warsaw
    command:
      - slack-mcp
    networks:
      homelab-network:
        ipv4_address: 172.20.0.82
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test:
        - CMD
        - slack-mcp
        - --health-check
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
  slack-ingest:
    labels:
      - traefik.enable=false
      - wud.watch=true
      - wud.tag.include=^\d+\.\d+\.\d+$
      - wud.trigger.include=dockercompose.slack
    image: ghcr.io/rgryta/slack-sync:0.2.0
    container_name: slack-ingest
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      SLACK_ACCOUNT: work
      SLACK_XOXC: ${SLACK_WORK_XOXC}
      SLACK_XOXD: ${SLACK_WORK_XOXD}
      SLACK_DSN: postgresql://slack_ingest:${SLACK_INGEST_DB_PASSWORD}@homelab-postgres:5432/slack
      TZ: Europe/Warsaw
    command:
      - slack-ingest
    networks:
      homelab-network:
        ipv4_address: 172.20.0.83
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
networks:
  homelab-network:
    external: true
