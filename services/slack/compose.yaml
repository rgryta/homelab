services:
  slack-mcp:
    labels:
      - traefik.enable=false
      - wud.watch=true
      - wud.watch.digest=true
      - autoheal=true
    image: 172.20.0.52:5000/slack-sync:latest
    container_name: slack-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SLACK_MCP_DSN: postgresql://slack_mcp:${SLACK_MCP_DB_PASSWORD}@homelab-postgres:5432/slack
      SLACK_MCP_HOST: 0.0.0.0
      SLACK_MCP_PORT: "8000"
      TZ: Europe/Warsaw
    command:
      - slack-sync
      - mcp
    networks:
      homelab-network:
        ipv4_address: 172.20.0.82
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
  # One ingester container per Slack account. Each carries its own session
  # credentials and its own scope; a dead token on one does not touch the other.
  # No healthcheck: a healthy ingester spends most of its life asleep between
  # polls, which no HTTP probe can distinguish from wedged. Use the
  # slack_sync_status MCP tool instead.
  slack-ingest-work:
    labels:
      - traefik.enable=false
      - wud.watch=true
      - wud.watch.digest=true
    image: 172.20.0.52:5000/slack-sync:latest
    container_name: slack-ingest-work
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SLACK_ACCOUNT: work
      SLACK_XOXC: ${SLACK_WORK_XOXC}
      SLACK_XOXD: ${SLACK_WORK_XOXD}
      SLACK_DSN: postgresql://slack_ingest:${SLACK_INGEST_DB_PASSWORD}@homelab-postgres:5432/slack
      SLACK_SCOPE_CHANNELS: stevie,stevie-dev
      TZ: Europe/Warsaw
    command:
      - slack-sync
      - ingest
    networks:
      homelab-network:
        ipv4_address: 172.20.0.83
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
networks:
  homelab-network:
    external: true
