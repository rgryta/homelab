services:
  instagram-mcp:
    labels:
      - traefik.enable=false
      - wud.watch=true
      - wud.tag.include=^\d+\.\d+\.\d+$
      - wud.trigger.include=dockercompose.instagram
      - autoheal=true
    image: ghcr.io/rgryta/instagram-sync:0.1.0
    container_name: instagram-mcp
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      INSTAGRAM_MCP_DSN: postgresql://instagram_mcp:${INSTAGRAM_MCP_DB_PASSWORD}@homelab-postgres:5432/instagram
      INSTAGRAM_MCP_HOST: 0.0.0.0
      INSTAGRAM_MCP_PORT: "8000"
      INSTAGRAM_MCP_ALLOWED_HOSTS: instagram-mcp
      TZ: Europe/Warsaw
    command:
      - /usr/local/bin/instagram-mcp
    networks:
      homelab-network:
        ipv4_address: 172.20.0.86
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/instagram-mcp
        - --health-check
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  instagram-ingest:
    labels:
      - traefik.enable=false
      - wud.watch=true
      - wud.tag.include=^\d+\.\d+\.\d+$
      - wud.trigger.include=dockercompose.instagram
    image: ghcr.io/rgryta/instagram-sync:0.1.0
    container_name: instagram-ingest
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      INSTAGRAM_DSN: postgresql://instagram_ingest:${INSTAGRAM_INGEST_DB_PASSWORD}@homelab-postgres:5432/instagram
      INSTAGRAM_ACCOUNT: ${INSTAGRAM_ACCOUNT}
      TZ: Europe/Warsaw
    command:
      - /usr/local/bin/instagram-ingest
    networks:
      homelab-network:
        ipv4_address: 172.20.0.87
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M

networks:
  homelab-network:
    external: true
