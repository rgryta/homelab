services:
  sonarr:
    labels:
      - traefik.enable=true
      - traefik.http.routers.sonarr.rule=Host(`sonarr.gryta.eu`)
      - traefik.http.routers.sonarr.entrypoints=websecure
      - traefik.http.routers.sonarr.tls.certresolver=le
      - traefik.http.routers.sonarr.middlewares=authentik-forward-auth@file
      - traefik.http.services.sonarr.loadbalancer.server.port=8989
      - wud.watch=true
      - wud.tag.include=^\d+\.\d+\.\d+$
    image: ghcr.io/linuxserver/sonarr:4.0.20
    container_name: sonarr
    networks:
      homelab-vpn-network:
        ipv4_address: 172.20.2.4
    extra_hosts:
      - qbit.gryta.eu:172.20.2.3 # Same IP as the VPN-client
      - prowlarr.gryta.eu:172.20.2.6
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - SONARR__SERVER__ALLOWEDHOSTS=sonarr.gryta.eu
    volumes:
      - sonarr_config:/config
      - qb_downloads:/downloads
      - tv_shows:/tv
      - anime:/anime
    restart: unless-stopped
  radarr:
    labels:
      - traefik.enable=true
      - traefik.http.routers.radarr.rule=Host(`radarr.gryta.eu`)
      - traefik.http.routers.radarr.entrypoints=websecure
      - traefik.http.routers.radarr.tls.certresolver=le
      - traefik.http.routers.radarr.middlewares=authentik-forward-auth@file
      - traefik.http.services.radarr.loadbalancer.server.port=7878
      - wud.watch=true
      - wud.tag.include=^\d+\.\d+\.\d+$
    image: lscr.io/linuxserver/radarr:6.4.4
    container_name: radarr
    networks:
      homelab-vpn-network:
        ipv4_address: 172.20.2.5
    extra_hosts:
      - qbit.gryta.eu:172.20.2.3
      - prowlarr.gryta.eu:172.20.2.6
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - RADARR__SERVER__TRUSTEDNETWORKS=172.20.2.2/32
    volumes:
      - radarr_config:/config
      - qb_downloads:/downloads
      - movies:/movies
    restart: unless-stopped
  prowlarr:
    labels:
      - traefik.enable=true
      - traefik.http.routers.prowlarr.rule=Host(`prowlarr.gryta.eu`)
      - traefik.http.routers.prowlarr.entrypoints=websecure
      - traefik.http.routers.prowlarr.tls.certresolver=le
      - traefik.http.routers.prowlarr.middlewares=authentik-forward-auth@file
      - traefik.http.services.prowlarr.loadbalancer.server.port=9696
      - wud.watch=true
      - wud.tag.include=^\d+\.\d+\.\d+$
    image: lscr.io/linuxserver/prowlarr:2.7.0
    container_name: prowlarr
    networks:
      homelab-vpn-network:
        ipv4_address: 172.20.2.6
    extra_hosts:
      - sonarr.gryta.eu:172.20.2.4
      - radarr.gryta.eu:172.20.2.5
      - lidarr.gryta.eu:172.20.2.8
      - flare.gryta.eu:172.20.2.7
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PROWLARR__SERVER__TRUSTEDNETWORKS=172.20.2.2/32
    volumes:
      - prowlarr_config:/config
      - qb_downloads:/downloads
    restart: unless-stopped
  flaresolverr:
    labels:
      - traefik.enable=false
      - wud.watch=true
      - wud.tag.include=^v\d+\.\d+\.\d+$
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: flaresolverr
    networks:
      homelab-vpn-network:
        ipv4_address: 172.20.2.7
    environment:
      - LOG_LEVEL=info
    restart: unless-stopped
  lidarr:
    labels:
      - traefik.enable=true
      - traefik.http.routers.lidarr.rule=Host(`lidarr.gryta.eu`)
      - traefik.http.routers.lidarr.entrypoints=websecure
      - traefik.http.routers.lidarr.tls.certresolver=le
      - traefik.http.routers.lidarr.middlewares=authentik-forward-auth@file
      - traefik.http.services.lidarr.loadbalancer.server.port=8686
      - wud.watch=true
      - wud.tag.include=^\d+\.\d+\.\d+$
      - wud.tag.exclude=^8\.1\.2135$
    image: lscr.io/linuxserver/lidarr:3.1.6
    container_name: lidarr
    networks:
      homelab-vpn-network:
        ipv4_address: 172.20.2.8
    extra_hosts:
      - qbit.gryta.eu:172.20.2.3
      - prowlarr.gryta.eu:172.20.2.6
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - lidarr_config:/config
      - qb_downloads:/downloads
      - music:/music
    restart: unless-stopped
  bazarr:
    labels:
      - traefik.enable=true
      - traefik.http.routers.bazarr.rule=Host(`bazarr.gryta.eu`)
      - traefik.http.routers.bazarr.entrypoints=websecure
      - traefik.http.routers.bazarr.tls.certresolver=le
      - traefik.http.routers.bazarr.middlewares=authentik-forward-auth@file
      - traefik.http.services.bazarr.loadbalancer.server.port=6767
      - wud.watch=true
      - wud.tag.include=^\d+\.\d+\.\d+$
    image: lscr.io/linuxserver/bazarr:1.6.2
    container_name: bazarr
    networks:
      homelab-vpn-network:
        ipv4_address: 172.20.2.9
    extra_hosts:
      - sonarr.gryta.eu:172.20.2.4
      - radarr.gryta.eu:172.20.2.5
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - bazarr_config:/config
      - tv_shows:/tv
      - movies:/movies
      - anime:/anime
    restart: unless-stopped
  cleanuparr:
    labels:
      - traefik.enable=true
      - traefik.http.routers.cleanuparr.rule=Host(`cleanuparr.gryta.eu`)
      - traefik.http.routers.cleanuparr.entrypoints=websecure
      - traefik.http.routers.cleanuparr.tls.certresolver=le
      - traefik.http.routers.cleanuparr.middlewares=authentik-forward-auth@file
      - traefik.http.services.cleanuparr.loadbalancer.server.port=11011
      - wud.watch=true
      - wud.tag.include=^\d+\.\d+\.\d+$
    container_name: cleanuparr
    restart: unless-stopped
    networks:
      homelab-vpn-network:
        ipv4_address: 172.20.2.10
    extra_hosts:
      - qbit.gryta.eu:172.20.2.3
      - sonarr.gryta.eu:172.20.2.4
      - radarr.gryta.eu:172.20.2.5
      - lidarr.gryta.eu:172.20.2.8
    volumes:
      - cleanuparr_config:/config
    environment:
      - PORT=11011
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    image: ghcr.io/cleanuparr/cleanuparr:2.10.12
  tdarr:
    labels:
      - traefik.enable=true
      - traefik.http.routers.tdarr.rule=Host(`tdarr.gryta.eu`)
      - traefik.http.routers.tdarr.entrypoints=websecure
      - traefik.http.routers.tdarr.tls.certresolver=le
      - traefik.http.routers.tdarr.middlewares=authentik-forward-auth@file
      - traefik.http.services.tdarr.loadbalancer.server.port=8265
      - wud.watch=true
      - wud.tag.include=^\d+\.\d+\.\d+$
    image: ghcr.io/haveagitgat/tdarr:3.04.00
    container_name: tdarr
    networks:
      homelab-vpn-network:
        ipv4_address: 172.20.2.12
    extra_hosts:
      - sonarr.gryta.eu:172.20.2.4
      - radarr.gryta.eu:172.20.2.5
    environment:
      - TZ=Etc/UTC
      - PUID=1000
      - PGID=1000
      - UMASK_SET=002
      - serverIP=172.20.2.12
      - serverPort=8266
      - webUIPort=8265
      - internalNode=true
      - inContainer=true
      - ffmpegVersion=7
      - nodeName=InternalNode
      - auth=false
      - openBrowser=false
      - maxLogSizeMB=10
      - cronPluginUpdate=
    volumes:
      - tdarr_server:/app/server
      - tdarr_configs:/app/configs
      - tdarr_logs:/app/logs
      - tdarr_transcode_cache:/temp
      - movies:/media/movies
      - tv_shows:/media/tv
      - anime:/media/anime
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
  slskd:
    labels:
      - traefik.enable=true
      - traefik.http.routers.slskd.rule=Host(`slskd.gryta.eu`)
      - traefik.http.routers.slskd.entrypoints=websecure
      - traefik.http.routers.slskd.tls.certresolver=le
      - traefik.http.routers.slskd.middlewares=authentik-forward-auth@file
      - traefik.http.services.slskd.loadbalancer.server.url=http://172.20.2.3:5030
      - wud.watch=true
      - wud.tag.include=^\d+\.\d+\.\d+$
    image: slskd/slskd:0.26.2
    container_name: slskd
    # Shares the VPN container's netns (like qBittorrent): all Soulseek traffic leaves via AirVPN.
    # After a vpn-client recreate this must be force-recreated too (same as qbittorrent).
    network_mode: container:vpn-client
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      # authentik forward-auth gates the UI; slskd's own login is off (same exposure as qBittorrent's WebUI)
      - SLSKD_NO_AUTH=true
      - SLSKD_SLSK_USERNAME=${SLSK_USERNAME}
      - SLSKD_SLSK_PASSWORD=${SLSK_PASSWORD}
      # reserved AirVPN port; keep local == remote (see vpn-client)
      - SLSKD_SLSK_LISTEN_PORT=${AIRVPN_SLSK_PORT}
      - SLSKD_DOWNLOADS_DIR=/downloads/complete
      - SLSKD_INCOMPLETE_DIR=/downloads/incomplete
    volumes:
      - slskd_config:/app
      - slskd_downloads:/downloads
    restart: unless-stopped
volumes:
  # *Arr's configs
  sonarr_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/quick/apps/volumes/arr/sonarr/config
  radarr_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/quick/apps/volumes/arr/radarr/config
  lidarr_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/quick/apps/volumes/arr/lidarr/config
  bazarr_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/quick/apps/volumes/arr/bazarr/config
  prowlarr_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/quick/apps/volumes/arr/prowlarr/config
  cleanuparr_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/quick/apps/volumes/arr/cleanuparr/config
  # Tdarr
  tdarr_server:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/quick/apps/volumes/arr/tdarr/server
  tdarr_configs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/quick/apps/volumes/arr/tdarr/configs
  tdarr_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/quick/apps/volumes/arr/tdarr/logs
  tdarr_transcode_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/quick/apps/volumes/arr/tdarr/transcode_cache
  # Downloads
  qb_downloads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/archive/apps/volumes/qbittorrent/downloads
  # Media
  tv_shows:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/archive/media/Shows
  movies:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/archive/media/Movies
  anime:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/archive/media/Anime
  music:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/archive/media/Music
  books:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/archive/media/Books
  # Soulseek
  slskd_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/quick/apps/volumes/slskd/config
  slskd_downloads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/archive/apps/volumes/slskd/downloads
networks:
  homelab-vpn-network:
    external: true
