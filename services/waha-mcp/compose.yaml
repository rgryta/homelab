services:
  waha-mcp:
    labels:
      - traefik.enable=false
      - wud.watch=true
      - wud.watch.digest=true
      - autoheal=true
    image: 172.20.0.52:5000/waha-mcp:latest
    container_name: waha-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WAHA_MCP_URL: http://waha:3000
      WAHA_MCP_API_KEY: ${WAHA_API_KEY}
      WAHA_MCP_SESSION: ${WAHA_SESSION}
      WAHA_MCP_HOST: 0.0.0.0
      WAHA_MCP_PORT: "8000"
      TZ: Europe/Warsaw
    networks:
      homelab-network:
        ipv4_address: 172.20.0.84
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
networks:
  homelab-network:
    external: true
